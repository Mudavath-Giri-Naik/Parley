<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Parley — any AI agent talks over MCP to a seller agent acting for the merchant, which calls the store's existing APIs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="55%" stop-color="#111826"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8eef7"/>
      <stop offset="60%" stop-color="#a9c6f5"/>
      <stop offset="100%" stop-color="#6ea8fe"/>
    </linearGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#6ea8fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a9c6f5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6ea8fe" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9fb4d4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>


  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="235" cy="270" rx="215" ry="150" fill="url(#glowBlue)"/>
  <ellipse cx="1045" cy="270" rx="215" ry="150" fill="url(#glowGreen)"/>

  <!-- wordmark -->
  <text x="640" y="96" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="url(#wordmark)" text-anchor="middle" letter-spacing="-2">Parley</text>
  <text x="640" y="130" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#93a7c4" text-anchor="middle">Your storefront, negotiating for itself.</text>

  <!-- buyer agent -->
  <g>
    <rect x="90" y="175" width="290" height="185" rx="18" fill="#111a28" stroke="#2b3a52" stroke-width="1.5"/>
    <text x="235" y="207" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="1.8" fill="#6ea8fe" text-anchor="middle">BUYER AGENT</text>

    <g>
      <rect x="110" y="222" width="250" height="34" rx="9" fill="#16202f" stroke="#2b3a52"/>
      <g transform="translate(124,231) scale(0.6667)"><path d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z" fill="#D97757"/></g>
      <text x="152" y="244" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#d6e4f7">Claude</text>
    </g>
    <g>
      <rect x="110" y="264" width="250" height="34" rx="9" fill="#16202f" stroke="#2b3a52"/>
      <circle cx="132" cy="281" r="7" fill="none" stroke="#9aa7c7" stroke-width="1.8"/>
      <text x="152" y="286" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#d6e4f7">ChatGPT</text>
    </g>
    <g>
      <rect x="110" y="306" width="250" height="34" rx="9" fill="#16202f" stroke="#2b3a52"/>
      <g transform="translate(124,315) scale(0.6667)"><path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81" fill="#A78BFA"/></g>
      <text x="152" y="328" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#d6e4f7">Gemini</text>
    </g>
    <text x="235" y="382" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#8298b8" text-anchor="middle">your customer's own AI</text>
    <text x="235" y="403" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#8298b8" text-anchor="middle">or any MCP-speaking client</text>
  </g>

  <!-- the wire -->
  <text x="640" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7e93b2" letter-spacing="0.4" text-anchor="middle">search · negotiate · order · pay</text>
  <path d="M380 270 H560" fill="none" stroke="url(#wire)" stroke-width="2.5"/>
  <path d="M720 270 H900" fill="none" stroke="url(#wire)" stroke-width="2.5"/>
  <path d="M566 264 l-11 6 11 6 z" fill="#8fb8ff" opacity="0.9"/>
  <path d="M714 264 l11 6 -11 6 z" fill="#8fb8ff" opacity="0.9"/>
  <rect x="596" y="255" width="88" height="30" rx="15" fill="#16202f" stroke="#3a5d8f"/>
  <text x="640" y="275" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#a9c6f5" text-anchor="middle" letter-spacing="1.2">MCP</text>
  <text x="640" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7e93b2" letter-spacing="0.4" text-anchor="middle">every decision audited</text>

  <!-- seller agent -->
  <g>
    <rect x="900" y="175" width="290" height="185" rx="18" fill="#111a28" stroke="#2b3a52" stroke-width="1.5"/>
    <text x="1045" y="207" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="1.8" fill="#4ade80" text-anchor="middle">SELLER AGENT</text>

    <g>
      <rect x="920" y="222" width="250" height="34" rx="9" fill="#16202f" stroke="#2b3a52"/>
      <path d="M934 233 h14 M934 240 h14 M934 247 h9" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
      <text x="962" y="244" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#d6e4f7">live stock &amp; pricing</text>
    </g>
    <g>
      <rect x="920" y="264" width="250" height="34" rx="9" fill="#16202f" stroke="#2b3a52"/>
      <path d="M941 274 v-3 a5 5 0 0 1 10 0 v3" fill="none" stroke="#4ade80" stroke-width="2"/>
      <rect x="936" y="274" width="20" height="14" rx="3" fill="none" stroke="#4ade80" stroke-width="2"/>
      <text x="962" y="286" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#d6e4f7">discount ceiling</text>
    </g>
    <g>
      <rect x="920" y="306" width="250" height="34" rx="9" fill="#16202f" stroke="#2b3a52"/>
      <path d="M939 323 l5 5 9 -11" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="962" y="328" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#d6e4f7">spend mandates</text>
    </g>
    <text x="1045" y="382" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#8298b8" text-anchor="middle">Parley, on behalf of the merchant</text>
    <text x="1045" y="403" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#8298b8" text-anchor="middle">calls your store's existing APIs</text>
  </g>

</svg>
