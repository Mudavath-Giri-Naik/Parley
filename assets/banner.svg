<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Parley — your storefront, negotiating for itself">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="55%" stop-color="#111826"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8eef7"/>
      <stop offset="60%" stop-color="#a9c6f5"/>
      <stop offset="100%" stop-color="#6ea8fe"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ea8fe" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#6ea8fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6ea8fe" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9fb4d4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <ellipse cx="255" cy="196" rx="190" ry="130" fill="url(#glowBlue)"/>
  <ellipse cx="1035" cy="196" rx="190" ry="130" fill="url(#glowGreen)"/>

  <!-- the negotiation wire -->
  <path d="M300 196 C 480 132, 800 260, 980 196" fill="none" stroke="url(#wire)" stroke-width="2.5"/>
  <circle cx="640" cy="192" r="5" fill="#e8eef7"/>
  <circle cx="512" cy="168" r="3" fill="#6ea8fe" opacity="0.85"/>
  <circle cx="768" cy="216" r="3" fill="#4ade80" opacity="0.85"/>

  <!-- buyer node -->
  <g transform="translate(180,140)">
    <rect x="0" y="0" width="120" height="112" rx="16" fill="#111a28" stroke="#2b3a52" stroke-width="1.5"/>
    <circle cx="60" cy="42" r="17" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <path d="M42 78 Q60 62 78 78" fill="none" stroke="#6ea8fe" stroke-width="2.5" stroke-linecap="round"/>
    <text x="60" y="100" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8fa3bf" text-anchor="middle" letter-spacing="1.2">BUYER AGENT</text>
  </g>

  <!-- seller node -->
  <g transform="translate(980,140)">
    <rect x="0" y="0" width="120" height="112" rx="16" fill="#111a28" stroke="#2b3a52" stroke-width="1.5"/>
    <path d="M38 34 H82 M38 50 H82 M38 66 H66" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <text x="60" y="100" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8fa3bf" text-anchor="middle" letter-spacing="1.2">YOUR STORE</text>
  </g>

  <!-- wordmark -->
  <text x="640" y="168" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="82" font-weight="700" fill="url(#wordmark)" text-anchor="middle" letter-spacing="-2.5">Parley</text>
  <text x="640" y="212" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#93a7c4" text-anchor="middle" letter-spacing="0.3">Your storefront, negotiating for itself.</text>

  <!-- footer chips -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7e93b2" text-anchor="middle">
    <text x="418" y="300">MCP</text>
    <text x="529" y="300">·</text>
    <text x="600" y="300">Next.js</text>
    <text x="671" y="300">·</text>
    <text x="742" y="300">Postgres</text>
    <text x="825" y="300">·</text>
    <text x="878" y="300">MIT</text>
  </g>
  <rect x="380" y="322" width="520" height="2" rx="1" fill="url(#wire)"/>
</svg>
